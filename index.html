<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alisya Live Schedule Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            maroon: { DEFAULT: '#7B1113', dark: '#520A0B', light: '#9E1B1E' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    .sticky-col { position: sticky; left: 0; z-index: 20; }
    .sticky-header { position: sticky; top: 0; z-index: 30; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- KONFIGURASI FIREBASE CLOUD REALTIME TERPASANG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAFiQ_IfBDRKU66J6zZLiORhpuODD71kg4",
      authDomain: "alisya-live-db.firebaseapp.com",
      databaseURL: "https://alisya-live-db-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "alisya-live-db",
      storageBucket: "alisya-live-db.firebasestorage.app",
      messagingSenderId: "409499788186",
      appId: "1:409499788186:web:63500185b22d83a9ded023"
    };

    let firebaseDb = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      firebaseDb = firebase.database();
    } catch(err) {
      console.error("Firebase init error:", err);
    }

    const DEFAULT_BRANDS = [
      { id: 'b_momuung', name: 'Mom Uung', color: '#B6D7A8' },
      { id: 'b_aquapress', name: 'AquaPress', color: '#00FFFF' },
      { id: 'b_moell', name: 'Moell / Back Up', color: '#FACC15' },
      { id: 'b_pribadi', name: 'Agenda Pribadi & OFF', color: '#EF4444' }
    ];

    const INITIAL_SCHEDULES = [
      { id: 's1', date: '2026-10-26', start_time: '14:00', end_time: '18:00', title: 'Shift 3 Mom Uung', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: 'Target GMV 20 Juta' },
      { id: 's2', date: '2026-10-26', start_time: '10:00', end_time: '12:00', title: 'Meet Aya', brand_id: 'b_pribadi', status: 'Meeting', color: '#00FFFF', notes: 'Briefing Outfit' },
      { id: 's3', date: '2026-10-27', start_time: '10:00', end_time: '14:00', title: 'Shift 2 Mom Uung', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: 'Sesi Siang' },
      { id: 's4', date: '2026-10-28', start_time: '10:00', end_time: '14:00', title: 'Shift 2 Mom Uung', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: 'Sesi Siang' },
      { id: 's5', date: '2026-10-29', start_time: '00:00', end_time: '23:59', title: 'Mom Uung OFF', brand_id: 'b_momuung', status: 'OFF', color: '#EF4444', notes: 'Rest Day' },
      { id: 's6', date: '2026-10-29', start_time: '08:00', end_time: '12:00', title: 'Aquapress Pagi', brand_id: 'b_aquapress', status: 'LIVE', color: '#00FFFF', notes: 'Shift Pagi' },
      { id: 's7', date: '2026-10-29', start_time: '12:00', end_time: '16:00', title: 'Aquapress Siang', brand_id: 'b_aquapress', status: 'LIVE', color: '#00FFFF', notes: 'Shift Siang' },
      { id: 's8', date: '2026-10-30', start_time: '06:00', end_time: '10:00', title: 'Shift 1 Mom Uung', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: 'Shift Pagi' },
      { id: 's9', date: '2026-10-30', start_time: '16:00', end_time: '20:00', title: 'Aquapress Sore', brand_id: 'b_aquapress', status: 'LIVE', color: '#00FFFF', notes: 'Shift Sore' },
      { id: 's10', date: '2026-10-31', start_time: '06:00', end_time: '10:00', title: 'Shift 1 Mom Uung', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: 'Weekend Promo' },
      { id: 's11', date: '2026-11-01', start_time: '18:00', end_time: '22:00', title: 'Shift 4 Mom Uung', brand_id: 'b_momuung', status: 'LIVE', color: '#B6D7A8', notes: 'Peak Hour' }
    ];

    const TIME_SLOTS = [
      { label: "12am-2am", start: "00:00", end: "02:00" },
      { label: "2am-4am", start: "02:00", end: "04:00" },
      { label: "4am-6am", start: "04:00", end: "06:00" },
      { label: "6am-8am", start: "06:00", end: "08:00" },
      { label: "8am-10am", start: "08:00", end: "10:00" },
      { label: "10am-12pm", start: "10:00", end: "12:00" },
      { label: "12pm-2pm", start: "12:00", end: "14:00" },
      { label: "2pm-4pm", start: "14:00", end: "16:00" },
      { label: "4pm-6pm", start: "16:00", end: "18:00" },
      { label: "6pm-8pm", start: "18:00", end: "20:00" },
      { label: "8pm-10pm", start: "20:00", end: "22:00" },
      { label: "10pm-12am", start: "22:00", end: "24:00" }
    ];

    function App() {
      const [view, setView] = useState('dashboard');
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      const [isSyncing, setIsSyncing] = useState(false);

      // Hak Akses Admin
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPin, setAdminPin] = useState(() => localStorage.getItem('alisya_admin_pin') || '1234');
      const [pinInputModal, setPinInputModal] = useState(false);
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState(false);

      // Sinkronisasi Firebase Otomatis
      useEffect(() => {
        if (!firebaseDb) return;
        setIsSyncing(true);
        const ref = firebaseDb.ref('alisya_schedules');
        ref.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val && Array.isArray(val)) {
            setSchedules(val);
          } else {
            // Jika database cloud masih kosong, inisialisasi dengan data default
            ref.set(INITIAL_SCHEDULES);
          }
          setIsSyncing(false);
        });
        return () => ref.off();
      }, []);

      const saveToCloud = (newList) => {
        setSchedules(newList);
        if (firebaseDb) {
          firebaseDb.ref('alisya_schedules').set(newList);
        }
      };

      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonth, setCurrentMonth] = useState(9); // Oktober 2026

      const [modalOpen, setModalOpen] = useState(false);
      const [selectedSchedule, setSelectedSchedule] = useState(null);
      const [formData, setFormData] = useState({
        id: '',
        date: '2026-10-27',
        start_time: '10:00',
        end_time: '12:00',
        title: '',
        brand_id: 'b_momuung',
        status: 'LIVE',
        color: '#B6D7A8',
        notes: ''
      });

      const [toast, setToast] = useState('');
      const notify = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };

      const daysInMonth = useMemo(() => new Date(currentYear, currentMonth + 1, 0).getDate(), [currentYear, currentMonth]);
      const monthName = useMemo(() => new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(new Date(currentYear, currentMonth, 1)), [currentYear, currentMonth]);

      // Login PIN Admin
      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (enteredPin === adminPin) {
          setIsAdmin(true);
          setPinInputModal(false);
          setEnteredPin('');
          setPinError(false);
          notify('Akses Admin Aktif! Anda sekarang bisa menambah & mengubah jadwal.');
        } else {
          setPinError(true);
        }
      };

      const handleOpenCreate = (dateStr = null, slotStart = '10:00', slotEnd = '12:00') => {
        if (!isAdmin) {
          setPinInputModal(true);
          return;
        }
        setSelectedSchedule(null);
        setFormData({
          id: 'sch_' + Date.now(),
          date: dateStr || `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`,
          start_time: slotStart,
          end_time: slotEnd,
          title: '',
          brand_id: 'b_momuung',
          status: 'LIVE',
          color: '#B6D7A8',
          notes: ''
        });
        setModalOpen(true);
      };

      const handleOpenEdit = (sch) => {
        if (!isAdmin) {
          setPinInputModal(true);
          return;
        }
        setSelectedSchedule(sch);
        setFormData({ ...sch });
        setModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        let autoColor = formData.color;
        if (formData.status === 'LIVE') autoColor = '#B6D7A8';
        if (formData.status === 'OFF') autoColor = '#EF4444';
        if (formData.status === 'Meeting') autoColor = '#00FFFF';
        if (formData.status === 'Sakit / Medis') autoColor = '#7B1113';

        const payload = { ...formData, color: autoColor };

        if (selectedSchedule) {
          saveToCloud(schedules.map(s => s.id === selectedSchedule.id ? payload : s));
          notify('Jadwal berhasil diperbarui ke Cloud!');
        } else {
          saveToCloud([...schedules, payload]);
          notify('Jadwal baru berhasil disimpan ke Cloud!');
        }
        setModalOpen(false);
      };

      const handleDelete = (id) => {
        if (confirm('Hapus jadwal ini dari sistem?')) {
          saveToCloud(schedules.filter(s => s.id !== id));
          setModalOpen(false);
          notify('Jadwal telah dihapus.');
        }
      };

      const currentMonthSchedules = useMemo(() => {
        return schedules.filter(s => {
          const [y, m] = s.date.split('-').map(Number);
          return y === currentYear && m === (currentMonth + 1);
        });
      }, [schedules, currentYear, currentMonth]);

      const stats = useMemo(() => {
        let totalLive = 0;
        let totalOff = 0;
        let totalSick = 0;
        let totalMeeting = 0;

        currentMonthSchedules.forEach(s => {
          if (s.status === 'LIVE') totalLive++;
          else if (s.status === 'OFF') totalOff++;
          else if (s.status === 'Sakit / Medis') totalSick++;
          else if (s.status === 'Meeting') totalMeeting++;
        });

        const perBrand = DEFAULT_BRANDS.map(b => {
          const list = currentMonthSchedules.filter(s => s.brand_id === b.id);
          const liveCount = list.filter(s => s.status === 'LIVE').length;
          const offCount = list.filter(s => s.status === 'OFF').length;
          return {
            name: b.name,
            totalShift: list.length,
            liveCount,
            offCount,
            totalJam: liveCount * 2
          };
        });

        return { totalLive, totalOff, totalSick, totalMeeting, perBrand };
      }, [currentMonthSchedules]);

      // Charts
      const donutCanvas = useRef(null);
      const barCanvas = useRef(null);
      const donutInst = useRef(null);
      const barInst = useRef(null);

      useEffect(() => {
        if (view !== 'dashboard') return;
        if (donutCanvas.current) {
          if (donutInst.current) donutInst.current.destroy();
          donutInst.current = new Chart(donutCanvas.current, {
            type: 'doughnut',
            data: {
              labels: ['Shift LIVE', 'Hari OFF', 'Sakit/Medis', 'Meeting'],
              datasets: [{
                data: [stats.totalLive, stats.totalOff, stats.totalSick, stats.totalMeeting],
                backgroundColor: ['#B6D7A8', '#EF4444', '#7B1113', '#00FFFF'],
                borderWidth: 2
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
          });
        }
        if (barCanvas.current) {
          if (barInst.current) barInst.current.destroy();
          barInst.current = new Chart(barCanvas.current, {
            type: 'bar',
            data: {
              labels: stats.perBrand.map(b => b.name),
              datasets: [
                { label: 'Shift LIVE', data: stats.perBrand.map(b => b.liveCount), backgroundColor: '#B6D7A8' },
                { label: 'Hari OFF', data: stats.perBrand.map(b => b.offCount), backgroundColor: '#EF4444' }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
          });
        }
      }, [view, stats]);

      return (
        <div className="min-h-screen flex flex-col">
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-2 text-xs font-bold animate-bounce">
              <span>✅</span><span>{toast}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="bg-maroon text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-lg sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-extrabold text-rose-300 text-xl border border-white/20">
                A
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-extrabold text-base tracking-wide">Alisya Live Schedule</h1>
                  {isAdmin ? (
                    <span className="bg-amber-400 text-amber-950 px-2 py-0.5 rounded text-[10px] font-extrabold shadow">MODE ADMIN</span>
                  ) : (
                    <span className="bg-white/20 text-rose-100 px-2 py-0.5 rounded text-[10px] font-medium">HANYA LIHAT</span>
                  )}
                  <span className="flex items-center gap-1 text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full font-bold">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>Live Cloud</span>
                  </span>
                </div>
                <p className="text-xs text-rose-200">Jadwal Siaran Alisya: Mom Uung • AquaPress • Moell</p>
              </div>
            </div>

            {/* TAB MENU */}
            <div className="flex bg-black/20 p-1 rounded-xl">
              <button onClick={() => setView('dashboard')} className={`px-4 py-2 rounded-lg text-xs font-bold transition ${view === 'dashboard' ? 'bg-white text-maroon shadow' : 'text-rose-100 hover:text-white'}`}>
                📊 Dashboard
              </button>
              <button onClick={() => setView('calendar')} className={`px-4 py-2 rounded-lg text-xs font-bold transition ${view === 'calendar' ? 'bg-white text-maroon shadow' : 'text-rose-100 hover:text-white'}`}>
                🗓️ Kalender Bulanan
              </button>
              <button onClick={() => setView('list')} className={`px-4 py-2 rounded-lg text-xs font-bold transition ${view === 'list' ? 'bg-white text-maroon shadow' : 'text-rose-100 hover:text-white'}`}>
                📋 Daftar Jadwal
              </button>
            </div>

            {/* NAVIGASI BULAN & ADMIN ACTION */}
            <div className="flex items-center gap-3">
              <div className="flex items-center bg-white/10 rounded-xl px-2 py-1 text-xs font-bold border border-white/20">
                <button onClick={() => currentMonth === 0 ? (setCurrentMonth(11), setCurrentYear(y => y-1)) : setCurrentMonth(m => m-1)} className="px-2 py-1 hover:bg-white/20 rounded">◀</button>
                <span className="px-3">{monthName} {currentYear}</span>
                <button onClick={() => currentMonth === 11 ? (setCurrentMonth(0), setCurrentYear(y => y+1)) : setCurrentMonth(m => m+1)} className="px-2 py-1 hover:bg-white/20 rounded">▶</button>
              </div>

              {isAdmin ? (
                <div className="flex items-center gap-2">
                  <button onClick={() => handleOpenCreate()} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow flex items-center gap-1 active:scale-95 transition">
                    <span>+</span><span>Tambah Jadwal</span>
                  </button>
                  <button onClick={() => { setIsAdmin(false); notify('Keluar dari Mode Admin'); }} className="bg-rose-950 hover:bg-black text-rose-200 px-3 py-2 rounded-xl text-xs font-semibold" title="Kunci Kembali">
                    🔒 Kunci
                  </button>
                </div>
              ) : (
                <button onClick={() => setPinInputModal(true)} className="bg-white/15 hover:bg-white/25 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border border-white/20 active:scale-95 transition">
                  <span>🔑</span><span>Akses Admin</span>
                </button>
              )}
            </div>
          </header>

          {/* KONTEN UTAMA */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            {/* VIEW 1: DASHBOARD */}
            {view === 'dashboard' && (
              <div className="space-y-6 animate-fade-in">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="text-xs font-bold text-slate-500 uppercase">Total Shift LIVE</div>
                    <div className="text-3xl font-extrabold text-emerald-600 mt-2">{stats.totalLive}</div>
                    <div className="text-[11px] text-slate-500 mt-2">≈ <span className="font-bold text-slate-700">{stats.totalLive * 2} Jam</span> Streaming</div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="text-xs font-bold text-slate-500 uppercase">Total Hari OFF</div>
                    <div className="text-3xl font-extrabold text-rose-600 mt-2">{stats.totalOff}</div>
                    <div className="text-[11px] text-slate-500 mt-2">Hari Istirahat / Libur</div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="text-xs font-bold text-slate-500 uppercase">Sakit / Medis</div>
                    <div className="text-3xl font-extrabold text-maroon mt-2">{stats.totalSick}</div>
                    <div className="text-[11px] text-slate-500 mt-2">Ke RS / Izin Sakit</div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="text-xs font-bold text-slate-500 uppercase">Meeting / Agenda</div>
                    <div className="text-3xl font-extrabold text-cyan-600 mt-2">{stats.totalMeeting}</div>
                    <div className="text-[11px] text-slate-500 mt-2">Briefing & Scripting</div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-800 mb-4">🍩 Distribusi Waktu Alisya ({monthName})</h3>
                    <div className="h-64 relative"><canvas ref={donutCanvas}></canvas></div>
                  </div>
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-800 mb-4">📊 Beban Live Alisya per Brand</h3>
                    <div className="h-64 relative"><canvas ref={barCanvas}></canvas></div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                  <h3 className="text-sm font-bold text-slate-800 mb-4">📋 Rekapitulasi Shift Live Alisya per Brand</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 uppercase border-b border-slate-200">
                        <tr>
                          <th className="px-4 py-3">Brand / Agenda</th>
                          <th className="px-4 py-3 text-center">Total Shift</th>
                          <th className="px-4 py-3 text-center">Shift LIVE</th>
                          <th className="px-4 py-3 text-center">Hari OFF</th>
                          <th className="px-4 py-3 text-center">Total Durasi Jam</th>
                          <th className="px-4 py-3 text-right">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {stats.perBrand.map((b, i) => (
                          <tr key={i} className="hover:bg-slate-50">
                            <td className="px-4 py-3 font-bold text-slate-800">{b.name}</td>
                            <td className="px-4 py-3 text-center font-semibold">{b.totalShift}</td>
                            <td className="px-4 py-3 text-center font-bold text-emerald-600">{b.liveCount}</td>
                            <td className="px-4 py-3 text-center font-bold text-rose-600">{b.offCount}</td>
                            <td className="px-4 py-3 text-center font-bold text-maroon">{b.totalJam} Jam</td>
                            <td className="px-4 py-3 text-right"><span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold text-[10px]">Aktif</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: KALENDER SPREADSHEET */}
            {view === 'calendar' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between text-xs">
                  <div className="text-slate-600">
                    {isAdmin ? (
                      <span>💡 <strong className="text-slate-800">Mode Admin Aktif:</strong> Klik sel kosong untuk buat jadwal baru, atau klik jadwal untuk mengedit/menghapusnya.</span>
                    ) : (
                      <span>👀 <strong className="text-slate-800">Mode Publik:</strong> Jadwal sinkron realtime dari Cloud. Klik <strong>Akses Admin</strong> di kanan atas jika ingin mengedit.</span>
                    )}
                  </div>
                  <div className="flex items-center gap-3 font-medium">
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-[#B6D7A8] inline-block border"></span> LIVE</span>
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-[#00FFFF] inline-block border"></span> Meeting</span>
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-[#EF4444] inline-block border"></span> OFF</span>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                  <div className="overflow-x-auto relative" style={{ maxHeight: '72vh' }}>
                    <table className="w-full border-collapse text-xs select-none">
                      <thead>
                        <tr className="bg-maroon text-white sticky-header">
                          <th className="sticky-col bg-maroon px-3 py-2.5 text-left font-bold border-b border-r border-rose-900 min-w-[120px]">
                            JAM \ TGL
                          </th>
                          {Array.from({ length: daysInMonth }).map((_, i) => {
                            const d = i + 1;
                            const dayName = new Intl.DateTimeFormat('id-ID', { weekday: 'short' }).format(new Date(currentYear, currentMonth, d));
                            return (
                              <th key={d} className="px-2 py-2 text-center font-bold border-b border-r border-rose-900 min-w-[60px]">
                                <div className="text-[10px] text-rose-200">{dayName}</div>
                                <div className="text-sm font-extrabold">{d}</div>
                              </th>
                            );
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {TIME_SLOTS.map(slot => (
                          <tr key={slot.label} className="border-b border-slate-200 hover:bg-slate-50/50">
                            <td className="sticky-col bg-slate-50 px-3 py-2 font-mono font-bold text-slate-700 border-r border-slate-200 text-[11px] whitespace-nowrap">
                              {slot.label}
                            </td>
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                              const day = i + 1;
                              const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                              const slotItems = schedules.filter(s => {
                                if (s.date !== dateStr) return false;
                                return (s.start_time < slot.end && s.end_time > slot.start) || (s.start_time === '00:00' && s.end_time === '23:59');
                              });

                              return (
                                <td
                                  key={day}
                                  onClick={() => handleOpenCreate(dateStr, slot.start, slot.end)}
                                  className={`border-r border-slate-200 p-1 align-top h-14 relative transition ${isAdmin ? 'hover:bg-rose-50/40 cursor-pointer' : ''}`}
                                >
                                  {slotItems.map(item => (
                                    <div
                                      key={item.id}
                                      onClick={(e) => { e.stopPropagation(); handleOpenEdit(item); }}
                                      className="p-1.5 rounded-lg font-bold text-[10px] leading-tight text-slate-900 shadow-sm border border-black/10 transition cursor-pointer mb-1 overflow-hidden"
                                      style={{ backgroundColor: item.color }}
                                    >
                                      <div className="truncate">{item.title}</div>
                                      <div className="text-[9px] font-mono text-slate-700">{item.start_time}-{item.end_time}</div>
                                    </div>
                                  ))}
                                </td>
                              );
                            })}
                          </tr>
                        ))}

                        {/* BARIS REKAP BRAND */}
                        <tr className="bg-slate-200 font-bold border-t-2 border-slate-300">
                          <td colSpan={daysInMonth + 1} className="px-4 py-2 text-slate-700 uppercase tracking-wider text-[11px]">
                            📌 Rekapitulasi Harian Brand
                          </td>
                        </tr>

                        {DEFAULT_BRANDS.map(b => (
                          <tr key={b.id} className="border-b border-slate-200 bg-slate-50">
                            <td className="sticky-col bg-slate-100 px-3 py-2 font-bold text-slate-800 border-r border-slate-200 whitespace-nowrap">
                              {b.name}
                            </td>
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                              const day = i + 1;
                              const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                              const dayItems = schedules.filter(s => s.brand_id === b.id && s.date === dateStr);

                              let text = '-';
                              let bg = '';
                              if (dayItems.length > 0) {
                                if (dayItems.some(s => s.status === 'OFF')) {
                                  text = 'OFF';
                                  bg = 'bg-rose-100 text-rose-800 font-bold';
                                } else {
                                  text = `${dayItems.length} Shift`;
                                  bg = 'bg-emerald-100 text-emerald-800 font-bold';
                                }
                              }

                              return (
                                <td key={day} className={`border-r border-slate-200 p-1 text-center text-[10px] ${bg}`}>
                                  {text}
                                </td>
                              );
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: DAFTAR JADWAL */}
            {view === 'list' && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-base">Semua Jadwal Terdaftar ({schedules.length})</h3>
                  {isAdmin && (
                    <button onClick={() => handleOpenCreate()} className="bg-maroon text-white px-4 py-2 rounded-xl text-xs font-bold">
                      + Tambah Baru
                    </button>
                  )}
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                      <tr>
                        <th className="px-4 py-3">Tanggal</th>
                        <th className="px-4 py-3">Jam</th>
                        <th className="px-4 py-3">Judul Shift</th>
                        <th className="px-4 py-3">Brand</th>
                        <th className="px-4 py-3">Status</th>
                        <th className="px-4 py-3">Catatan</th>
                        {isAdmin && <th className="px-4 py-3 text-right">Aksi</th>}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {schedules.map(s => {
                        const brand = DEFAULT_BRANDS.find(b => b.id === s.brand_id);
                        return (
                          <tr key={s.id} className="hover:bg-slate-50">
                            <td className="px-4 py-3 font-semibold">{s.date}</td>
                            <td className="px-4 py-3 font-mono">{s.start_time} - {s.end_time}</td>
                            <td className="px-4 py-3 font-bold text-slate-800">
                              <span className="inline-block w-2.5 h-2.5 rounded-full mr-2" style={{ backgroundColor: s.color }}></span>
                              {s.title}
                            </td>
                            <td className="px-4 py-3">{brand?.name || s.brand_id}</td>
                            <td className="px-4 py-3"><span className="px-2 py-0.5 rounded font-bold text-[10px]" style={{ backgroundColor: s.color + '44' }}>{s.status}</span></td>
                            <td className="px-4 py-3 italic text-slate-500">{s.notes || '-'}</td>
                            {isAdmin && (
                              <td className="px-4 py-3 text-right space-x-2">
                                <button onClick={() => handleOpenEdit(s)} className="text-blue-600 font-bold hover:underline">Edit</button>
                                <button onClick={() => handleDelete(s.id)} className="text-rose-600 font-bold hover:underline">Hapus</button>
                              </td>
                            )}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* MODAL INPUT PIN ADMIN */}
          {pinInputModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden p-6 text-center space-y-4 animate-in zoom-in duration-150">
                <div className="w-12 h-12 rounded-2xl bg-rose-100 text-maroon flex items-center justify-center text-2xl mx-auto font-black">
                  🔑
                </div>
                <div>
                  <h3 className="font-bold text-base text-slate-800">Masukkan PIN Admin</h3>
                  <p className="text-xs text-slate-500 mt-1">Masukkan PIN untuk membuka fitur input & edit jadwal.</p>
                </div>
                <form onSubmit={handleVerifyPin} className="space-y-3">
                  <input
                    type="password"
                    maxLength="6"
                    autoFocus
                    value={enteredPin}
                    onChange={e => { setEnteredPin(e.target.value); setPinError(false); }}
                    placeholder="PIN (Default: 1234)"
                    className="w-full text-center text-xl tracking-widest font-mono font-bold bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-maroon"
                  />
                  {pinError && <div className="text-rose-600 text-xs font-bold">PIN salah! Coba lagi.</div>}
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setPinInputModal(false)} className="w-1/2 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
                      Batal
                    </button>
                    <button type="submit" className="w-1/2 py-2.5 rounded-xl bg-maroon hover:bg-maroon-dark text-white font-bold text-xs shadow">
                      Buka Akses
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL FORM INPUT/EDIT JADWAL */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in duration-150">
                <div className="bg-maroon text-white p-5 flex justify-between items-center">
                  <h3 className="font-bold text-base">{selectedSchedule ? 'Edit Jadwal' : 'Tambah Jadwal Baru'}</h3>
                  <button onClick={() => setModalOpen(false)} className="text-rose-200 hover:text-white font-bold text-lg">✕</button>
                </div>
                <form onSubmit={handleSave} className="p-6 space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Judul Shift / Aktivitas *</label>
                    <input
                      type="text"
                      required
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      placeholder="Contoh: Shift 3 Mom Uung"
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Pilih Brand *</label>
                      <select
                        value={formData.brand_id}
                        onChange={e => setFormData({ ...formData, brand_id: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                      >
                        {DEFAULT_BRANDS.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Status Kehadiran *</label>
                      <select
                        value={formData.status}
                        onChange={e => setFormData({ ...formData, status: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                      >
                        <option value="LIVE">LIVE (Hijau)</option>
                        <option value="Meeting">Meeting (Cyan)</option>
                        <option value="OFF">OFF / Libur (Merah)</option>
                        <option value="Sakit / Medis">Sakit / Medis (Maroon)</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tanggal *</label>
                    <input
                      type="date"
                      required
                      value={formData.date}
                      onChange={e => setFormData({ ...formData, date: e.target.value })}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Mulai *</label>
                      <input
                        type="time"
                        required
                        value={formData.start_time}
                        onChange={e => setFormData({ ...formData, start_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Selesai *</label>
                      <input
                        type="time"
                        required
                        value={formData.end_time}
                        onChange={e => setFormData({ ...formData, end_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Catatan</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({ ...formData, notes: e.target.value })}
                      placeholder="Script, target GMV, atau briefing khusus..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800"
                    ></textarea>
                  </div>
                  <div className="pt-3 border-t border-slate-100 flex justify-between items-center">
                    {selectedSchedule ? (
                      <button type="button" onClick={() => handleDelete(selectedSchedule.id)} className="text-rose-600 hover:text-rose-800 font-bold">
                        Hapus Jadwal
                      </button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setModalOpen(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl font-bold">
                        Batal
                      </button>
                      <button type="submit" className="bg-maroon hover:bg-maroon-dark text-white px-5 py-2 rounded-xl font-bold shadow">
                        Simpan ke Cloud
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
