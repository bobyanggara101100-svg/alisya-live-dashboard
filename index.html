<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alisya Live Schedule Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            maroon: {
              DEFAULT: '#7B1113',
              dark: '#580B0D',
              light: '#9E1B1E',
              subtle: '#FFF5F5'
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    .sticky-col { position: sticky; left: 0; z-index: 20; }
    .sticky-header { position: sticky; top: 0; z-index: 30; }
  </style>

</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;


    // Master Data Akun / Brand
    const INITIAL_ACCOUNTS = [
      { id: 'acc_1', name: 'Alisya (Host)', role: 'Host Utama', color: '#B6D7A8' },
      { id: 'acc_2', name: 'Mom Uung', role: 'Brand Utama', color: '#B6D7A8' },
      { id: 'acc_3', name: 'AquaPress', role: 'Brand Shift', color: '#00FFFF' },
      { id: 'acc_4', name: 'Back Up Moell', role: 'Backup Host', color: '#FACC15' }
    ];


    // Master Data Jadwal Sesuai Spreadsheet Referensi
    const INITIAL_SCHEDULES = [
      { id: 's1', date: '2026-10-26', start_time: '14:00', end_time: '18:00', title: 'Shift 3 Mom Uung', person_id: 'acc_2', status: 'LIVE', category: 'Live Streaming', color: '#B6D7A8', notes: 'Target GMV 20 Juta' },
      { id: 's2', date: '2026-10-26', start_time: '10:00', end_time: '12:00', title: 'Meet Aya', person_id: 'acc_1', status: 'Meeting', category: 'Meeting', color: '#00FFFF', notes: 'Briefing Outfit' },
      { id: 's3', date: '2026-10-27', start_time: '10:00', end_time: '14:00', title: 'Shift 2 Mom Uung', person_id: 'acc_2', status: 'LIVE', category: 'Live Streaming', color: '#B6D7A8', notes: 'Sesi Siang' },
      { id: 's4', date: '2026-10-28', start_time: '10:00', end_time: '14:00', title: 'Shift 2 Mom Uung', person_id: 'acc_2', status: 'LIVE', category: 'Live Streaming', color: '#B6D7A8', notes: 'Sesi Siang' },
      { id: 's5', date: '2026-10-29', start_time: '00:00', end_time: '23:59', title: 'Mom Uung OFF', person_id: 'acc_2', status: 'OFF', category: 'Rest / OFF', color: '#EF4444', notes: 'Libur Rutin' },
      { id: 's6', date: '2026-10-29', start_time: '08:00', end_time: '12:00', title: 'Aquapress Pagi', person_id: 'acc_3', status: 'LIVE', category: 'Live Streaming', color: '#00FFFF', notes: 'Shift Pagi' },
      { id: 's7', date: '2026-10-29', start_time: '12:00', end_time: '16:00', title: 'Aquapress Siang', person_id: 'acc_3', status: 'LIVE', category: 'Live Streaming', color: '#00FFFF', notes: 'Shift Siang' },
      { id: 's8', date: '2026-10-30', start_time: '06:00', end_time: '10:00', title: 'Shift 1 Mom Uung', person_id: 'acc_2', status: 'LIVE', category: 'Live Streaming', color: '#B6D7A8', notes: 'Shift Pagi' },
      { id: 's9', date: '2026-10-30', start_time: '16:00', end_time: '20:00', title: 'Aquapress Sore', person_id: 'acc_3', status: 'LIVE', category: 'Live Streaming', color: '#00FFFF', notes: 'Shift Sore' },
      { id: 's10', date: '2026-10-31', start_time: '06:00', end_time: '10:00', title: 'Shift 1 Mom Uung', person_id: 'acc_2', status: 'LIVE', category: 'Live Streaming', color: '#B6D7A8', notes: 'Weekend Promo' },
      { id: 's11', date: '2026-11-01', start_time: '18:00', end_time: '22:00', title: 'Shift 4 Mom Uung', person_id: 'acc_2', status: 'LIVE', category: 'Live Streaming', color: '#B6D7A8', notes: 'Peak Hour' }
    ];


    const TIME_SLOTS = [
      { label: "12am-2am", start: "00:00", end: "02:00" },
      { label: "2am-4am", start: "02:00", end: "04:00" },
      { label: "4am-6am", start: "04:00", end: "06:00" },
      { label: "6am-8am", start: "06:00", end: "08:00" },
      { label: "8am-10am", start: "08:00", end: "10:00" },
      { label: "10am-12pm", start: "10:00", end: "12:00" },
      { label: "12pm-2pm", start: "12:00", end: "14:00" },
      { label: "2pm-4pm", start: "14:00", end: "16:00" },
      { label: "4pm-6pm", start: "16:00", end: "18:00" },
      { label: "6pm-8pm", start: "18:00", end: "20:00" },
      { label: "8pm-10pm", start: "20:00", end: "22:00" },
      { label: "10pm-12am", start: "22:00", end: "24:00" }
    ];


    function App() {
      const [view, setView] = useState('dashboard'); // 'dashboard', 'calendar', 'list'
      const [accounts, setAccounts] = useState(() => {
        const local = localStorage.getItem('alisya_app_accounts');
        return local ? JSON.parse(local) : INITIAL_ACCOUNTS;
      });
      const [schedules, setSchedules] = useState(() => {
        const local = localStorage.getItem('alisya_app_schedules');
        return local ? JSON.parse(local) : INITIAL_SCHEDULES;
      });


      // Simpan otomatis ke LocalStorage
      useEffect(() => {
        localStorage.setItem('alisya_app_accounts', JSON.stringify(accounts));
        localStorage.setItem('alisya_app_schedules', JSON.stringify(schedules));
      }, [accounts, schedules]);


      // Bulan Aktif (Default Oktober 2026)
      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonth, setCurrentMonth] = useState(9); // 9 = Oktober


      // Modal State
      const [modalOpen, setModalOpen] = useState(false);
      const [selectedSchedule, setSelectedSchedule] = useState(null);
      const [formData, setFormData] = useState({
        id: '',
        date: '2026-10-27',
        start_time: '10:00',
        end_time: '12:00',
        title: '',
        person_id: 'acc_2',
        status: 'LIVE',
        category: 'Live Streaming',
        color: '#B6D7A8',
        notes: ''
      });


      const [toast, setToast] = useState('');
      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };


      const daysInMonth = useMemo(() => {
        return new Date(currentYear, currentMonth + 1, 0).getDate();
      }, [currentYear, currentMonth]);


      const monthName = useMemo(() => {
        return new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(new Date(currentYear, currentMonth, 1));
      }, [currentYear, currentMonth]);


      // Buka Modal Tambah Baru
      const handleOpenCreate = (dateStr = null, slotStart = '10:00', slotEnd = '12:00') => {
        setSelectedSchedule(null);
        setFormData({
          id: 'sch_' + Date.now(),
          date: dateStr || `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`,
          start_time: slotStart,
          end_time: slotEnd,
          title: '',
          person_id: accounts[0]?.id || 'acc_2',
          status: 'LIVE',
          category: 'Live Streaming',
          color: '#B6D7A8',
          notes: ''
        });
        setModalOpen(true);
      };


      // Buka Modal Edit
      const handleOpenEdit = (sch) => {
        setSelectedSchedule(sch);
        setFormData({ ...sch });
        setModalOpen(true);
      };


      // Simpan Perubahan Jadwal
      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) {
          alert('Judul shift / kegiatan harus diisi!');
          return;
        }


        let autoColor = formData.color;
        if (formData.status === 'LIVE') autoColor = '#B6D7A8';
        if (formData.status === 'OFF') autoColor = '#EF4444';
        if (formData.status === 'Meeting') autoColor = '#00FFFF';
        if (formData.status === 'Sakit / Izin') autoColor = '#7B1113';


        const payload = { ...formData, color: autoColor };


        if (selectedSchedule) {
          setSchedules(prev => prev.map(s => s.id === selectedSchedule.id ? payload : s));
          notify('Jadwal berhasil diperbarui!');
        } else {
          setSchedules(prev => [...prev, payload]);
          notify('Jadwal baru berhasil ditambahkan!');
        }
        setModalOpen(false);
      };


      // Hapus Jadwal
      const handleDelete = (id) => {
        if (confirm('Yakin ingin menghapus jadwal ini?')) {
          setSchedules(prev => prev.filter(s => s.id !== id));
          setModalOpen(false);
          notify('Jadwal telah dihapus.');
        }
      };


      // Perhitungan Rekap & KPI
      const currentMonthSchedules = useMemo(() => {
        return schedules.filter(s => {
          const [y, m] = s.date.split('-').map(Number);
          return y === currentYear && m === (currentMonth + 1);
        });
      }, [schedules, currentYear, currentMonth]);


      const stats = useMemo(() => {
        let totalLive = 0;
        let totalOff = 0;
        let totalSick = 0;
        let totalMeeting = 0;


        currentMonthSchedules.forEach(s => {
          if (s.status === 'LIVE') totalLive++;
          else if (s.status === 'OFF') totalOff++;
          else if (s.status === 'Sakit / Izin') totalSick++;
          else if (s.status === 'Meeting') totalMeeting++;
        });


        const perAccount = accounts.map(acc => {
          const list = currentMonthSchedules.filter(s => s.person_id === acc.id);
          const liveCount = list.filter(s => s.status === 'LIVE').length;
          const offCount = list.filter(s => s.status === 'OFF').length;
          return {
            name: acc.name,
            totalShift: list.length,
            liveCount,
            offCount,
            totalJam: liveCount * 2
          };
        });


        return {
          totalLive,
          totalOff,
          totalSick,
          totalMeeting,
          totalAll: currentMonthSchedules.length,
          perAccount
        };
      }, [currentMonthSchedules, accounts]);


      // Chart.js Binding
      const donutCanvasRef = useRef(null);
      const barCanvasRef = useRef(null);
      const donutChartRef = useRef(null);
      const barChartRef = useRef(null);


      useEffect(() => {
        if (view !== 'dashboard') return;


        if (donutCanvasRef.current) {
          if (donutChartRef.current) donutChartRef.current.destroy();
          donutChartRef.current = new Chart(donutCanvasRef.current, {
            type: 'doughnut',
            data: {
              labels: ['LIVE', 'OFF', 'Sakit/Izin', 'Meeting'],
              datasets: [{
                data: [stats.totalLive, stats.totalOff, stats.totalSick, stats.totalMeeting],
                backgroundColor: ['#B6D7A8', '#EF4444', '#7B1113', '#00FFFF'],
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } }
            }
          });
        }


        if (barCanvasRef.current) {
          if (barChartRef.current) barChartRef.current.destroy();
          barChartRef.current = new Chart(barCanvasRef.current, {
            type: 'bar',
            data: {
              labels: stats.perAccount.map(a => a.name),
              datasets: [
                {
                  label: 'Shift LIVE',
                  data: stats.perAccount.map(a => a.liveCount),
                  backgroundColor: '#B6D7A8'
                },
                {
                  label: 'Hari OFF',
                  data: stats.perAccount.map(a => a.offCount),
                  backgroundColor: '#EF4444'
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: { y: { beginAtZero: true } }
            }
          });
        }
      }, [view, stats]);


      return (
        <div className="min-h-screen flex flex-col">
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 animate-bounce text-xs font-bold">
              <span>✅</span>
              <span>{toast}</span>
            </div>
          )}


          {/* HEADER NAVIGASI */}
          <header className="bg-maroon text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-lg sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-extrabold text-rose-300 text-xl border border-white/20">
                A
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-wide">Alisya Live Schedule</h1>
                <p className="text-xs text-rose-200">Interactive Dashboard & Calendar</p>
              </div>
            </div>


            {/* TAB MENU */}
            <div className="flex bg-black/20 p-1 rounded-xl">
              <button
                onClick={() => setView('dashboard')}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition ${view === 'dashboard' ? 'bg-white text-maroon shadow' : 'text-rose-100 hover:text-white'}`}
              >
                📊 Dashboard Statistik
              </button>
              <button
                onClick={() => setView('calendar')}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition ${view === 'calendar' ? 'bg-white text-maroon shadow' : 'text-rose-100 hover:text-white'}`}
              >
                🗓️ Kalender Bulanan
              </button>
              <button
                onClick={() => setView('list')}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition ${view === 'list' ? 'bg-white text-maroon shadow' : 'text-rose-100 hover:text-white'}`}
              >
                📋 Daftar Jadwal
              </button>
            </div>


            {/* NAVIGASI BULAN & TOMBOL INPUT */}
            <div className="flex items-center gap-3">
              <div className="flex items-center bg-white/10 rounded-xl px-2 py-1 text-xs font-bold border border-white/20">
                <button
                  onClick={() => {
                    if (currentMonth === 0) { setCurrentMonth(11); setCurrentYear(y => y - 1); }
                    else { setCurrentMonth(m => m - 1); }
                  }}
                  className="px-2 py-1 hover:bg-white/20 rounded"
                >◀</button>
                <span className="px-3">{monthName} {currentYear}</span>
                <button
                  onClick={() => {
                    if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(y => y + 1); }
                    else { setCurrentMonth(m => m + 1); }
                  }}
                  className="px-2 py-1 hover:bg-white/20 rounded"
                >▶</button>
              </div>


              <button
                onClick={() => handleOpenCreate()}
                className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5 active:scale-95"
              >
                <span className="text-sm">+</span>
                <span>Tambah Jadwal</span>
              </button>
            </div>
          </header>


          {/* MAIN CONTENT */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            
            {/* TAB DASHBOARD */}
            {view === 'dashboard' && (
              <div className="space-y-6 animate-fade-in">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Total LIVE</div>
                      <div className="text-3xl font-extrabold text-emerald-600 mt-2">{stats.totalLive}</div>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-3 pt-2 border-t border-slate-100">
                      ≈ <span className="font-bold text-slate-700">{stats.totalLive * 2} Jam</span> Streaming
                    </div>
                  </div>


                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Total OFF</div>
                      <div className="text-3xl font-extrabold text-rose-600 mt-2">{stats.totalOff}</div>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-3 pt-2 border-t border-slate-100">
                      Hari Istirahat / Libur
                    </div>
                  </div>


                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Sakit / Izin</div>
                      <div className="text-3xl font-extrabold text-maroon mt-2">{stats.totalSick}</div>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-3 pt-2 border-t border-slate-100">
                      Emergency Leave / Ke RS
                    </div>
                  </div>


                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Meeting</div>
                      <div className="text-3xl font-extrabold text-cyan-600 mt-2">{stats.totalMeeting}</div>
                    </div>
                    <div className="text-[11px] text-slate-500 mt-3 pt-2 border-t border-slate-100">
                      Briefing & Scripting
                    </div>
                  </div>
                </div>


                {/* DIAGRAM VISUALISASI */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                      <span>🍩</span> Distribusi Status Jadwal ({monthName})
                    </h3>
                    <div className="h-64 relative">
                      <canvas ref={donutCanvasRef}></canvas>
                    </div>
                  </div>


                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                      <span>📊</span> Perbandingan Shift per Akun / Brand
                    </h3>
                    <div className="h-64 relative">
                      <canvas ref={barCanvasRef}></canvas>
                    </div>
                  </div>
                </div>


                {/* TABEL STATISTIK PER AKUN */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                  <h3 className="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span>👥</span> Rekapitulasi Rinci Mom Uung & AquaPress
                  </h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-700">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="px-4 py-3">Nama Akun / Brand</th>
                          <th className="px-4 py-3 text-center">Total Shift</th>
                          <th className="px-4 py-3 text-center">Shift LIVE</th>
                          <th className="px-4 py-3 text-center">Hari OFF</th>
                          <th className="px-4 py-3 text-center">Estimasi Jam Live</th>
                          <th className="px-4 py-3 text-right">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {stats.perAccount.map((acc, i) => (
                          <tr key={i} className="hover:bg-slate-50 transition">
                            <td className="px-4 py-3 font-bold text-slate-800">{acc.name}</td>
                            <td className="px-4 py-3 text-center font-semibold">{acc.totalShift}</td>
                            <td className="px-4 py-3 text-center font-bold text-emerald-600">{acc.liveCount}</td>
                            <td className="px-4 py-3 text-center font-bold text-rose-600">{acc.offCount}</td>
                            <td className="px-4 py-3 text-center font-bold text-maroon">{acc.totalJam} Jam</td>
                            <td className="px-4 py-3 text-right">
                              <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">Aktif</span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}


            {/* TAB KALENDER */}
            {view === 'calendar' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between text-xs">
                  <div className="font-semibold text-slate-600">
                    💡 <span className="font-bold text-slate-800">Petunjuk:</span> Klik pada <span className="text-emerald-700 font-bold">sel kosong</span> untuk membuat jadwal baru, atau klik pada <span className="text-maroon font-bold">kotak jadwal</span> untuk mengedit/menghapusnya.
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-[#B6D7A8] inline-block border"></span> LIVE</span>
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-[#00FFFF] inline-block border"></span> Meeting</span>
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-[#EF4444] inline-block border"></span> OFF</span>
                  </div>
                </div>


                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                  <div className="overflow-x-auto relative" style={{ maxHeight: '72vh' }}>
                    <table className="w-full border-collapse text-xs select-none">
                      <thead>
                        <tr className="bg-maroon text-white sticky-header">
                          <th className="sticky-col bg-maroon px-3 py-2.5 text-left font-bold border-b border-r border-rose-900 min-w-[120px]">
                            JAM \ TGL
                          </th>
                          {Array.from({ length: daysInMonth }).map((_, i) => {
                            const d = i + 1;
                            const dayName = new Intl.DateTimeFormat('id-ID', { weekday: 'short' }).format(new Date(currentYear, currentMonth, d));
                            return (
                              <th key={d} className="px-2 py-2 text-center font-bold border-b border-r border-rose-900 min-w-[60px]">
                                <div className="text-[10px] text-rose-200">{dayName}</div>
                                <div className="text-sm font-extrabold">{d}</div>
                              </th>
                            );
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {TIME_SLOTS.map(slot => (
                          <tr key={slot.label} className="border-b border-slate-200 hover:bg-slate-50/50">
                            <td className="sticky-col bg-slate-50 px-3 py-2 font-mono font-bold text-slate-700 border-r border-slate-200 text-[11px] whitespace-nowrap">
                              {slot.label}
                            </td>
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                              const day = i + 1;
                              const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                              
                              const slotItems = schedules.filter(s => {
                                if (s.date !== dateStr) return false;
                                return (s.start_time < slot.end && s.end_time > slot.start) || (s.start_time === '00:00' && s.end_time === '23:59');
                              });


                              return (
                                <td
                                  key={day}
                                  onClick={() => handleOpenCreate(dateStr, slot.start, slot.end)}
                                  className="border-r border-slate-200 p-1 align-top h-14 hover:bg-rose-50/40 cursor-pointer transition relative"
                                  title={`Klik untuk tambah jadwal tanggal ${dateStr} jam ${slot.label}`}
                                >
                                  {slotItems.map(item => (
                                    <div
                                      key={item.id}
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        handleOpenEdit(item);
                                      }}
                                      className="p-1.5 rounded-lg font-bold text-[10px] leading-tight text-slate-900 shadow-sm border border-black/10 hover:scale-105 active:scale-95 transition cursor-pointer mb-1 overflow-hidden"
                                      style={{ backgroundColor: item.color }}
                                      title="Klik untuk Edit / Hapus"
                                    >
                                      <div className="truncate">{item.title}</div>
                                      <div className="text-[9px] font-mono text-slate-700">{item.start_time}-{item.end_time}</div>
                                    </div>
                                  ))}
                                </td>
                              );
                            })}
                          </tr>
                        ))}


                        {/* ROW REKAP DI BAWAH GRID */}
                        <tr className="bg-slate-200 font-bold border-t-2 border-slate-300">
                          <td colSpan={daysInMonth + 1} className="px-4 py-2 text-slate-700 uppercase tracking-wider text-[11px]">
                            📌 Rekapitulasi Harian Brand / Akun
                          </td>
                        </tr>


                        {accounts.map(acc => (
                          <tr key={acc.id} className="border-b border-slate-200 bg-slate-50">
                            <td className="sticky-col bg-slate-100 px-3 py-2 font-bold text-slate-800 border-r border-slate-200 whitespace-nowrap">
                              {acc.name}
                            </td>
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                              const day = i + 1;
                              const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                              const accDayItems = schedules.filter(s => s.person_id === acc.id && s.date === dateStr);


                              let text = '-';
                              let bg = '';
                              if (accDayItems.length > 0) {
                                const isOff = accDayItems.some(s => s.status === 'OFF');
                                if (isOff) {
                                  text = 'OFF';
                                  bg = 'bg-rose-100 text-rose-800 font-bold';
                                } else {
                                  text = `${accDayItems.length} Shift`;
                                  bg = 'bg-emerald-100 text-emerald-800 font-bold';
                                }
                              }


                              return (
                                <td key={day} className={`border-r border-slate-200 p-1 text-center text-[10px] ${bg}`}>
                                  {text}
                                </td>
                              );
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}


            {/* TAB DAFTAR JADWAL */}
            {view === 'list' && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-base">Semua Jadwal Terdaftar ({schedules.length})</h3>
                  <button onClick={() => handleOpenCreate()} className="bg-maroon text-white px-4 py-2 rounded-xl text-xs font-bold">
                    + Tambah Baru
                  </button>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                      <tr>
                        <th className="px-4 py-3">Tanggal</th>
                        <th className="px-4 py-3">Jam</th>
                        <th className="px-4 py-3">Judul Shift</th>
                        <th className="px-4 py-3">Akun / Talent</th>
                        <th className="px-4 py-3">Status</th>
                        <th className="px-4 py-3">Catatan</th>
                        <th className="px-4 py-3 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {schedules.map(s => {
                        const acc = accounts.find(a => a.id === s.person_id);
                        return (
                          <tr key={s.id} className="hover:bg-slate-50">
                            <td className="px-4 py-3 font-semibold text-slate-900">{s.date}</td>
                            <td className="px-4 py-3 font-mono">{s.start_time} - {s.end_time}</td>
                            <td className="px-4 py-3 font-bold text-slate-800">
                              <span className="inline-block w-2.5 h-2.5 rounded-full mr-2" style={{ backgroundColor: s.color }}></span>
                              {s.title}
                            </td>
                            <td className="px-4 py-3">{acc?.name || s.person_id}</td>
                            <td className="px-4 py-3">
                              <span className="px-2 py-0.5 rounded font-bold text-[10px]" style={{ backgroundColor: s.color + '44', color: s.color === '#00FFFF' ? '#0891B2' : s.color }}>
                                {s.status}
                              </span>
                            </td>
                            <td className="px-4 py-3 italic text-slate-500">{s.notes || '-'}</td>
                            <td className="px-4 py-3 text-right space-x-2">
                              <button onClick={() => handleOpenEdit(s)} className="text-blue-600 font-bold hover:underline">Edit</button>
                              <button onClick={() => handleDelete(s.id)} className="text-rose-600 font-bold hover:underline">Hapus</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>


          {/* MODAL INPUT & EDIT */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 animate-in fade-in zoom-in duration-150">
                <div className="bg-maroon text-white p-5 flex justify-between items-center">
                  <h3 className="font-bold text-base">{selectedSchedule ? 'Edit Jadwal' : 'Tambah Jadwal Baru'}</h3>
                  <button onClick={() => setModalOpen(false)} className="text-rose-200 hover:text-white font-bold text-lg">✕</button>
                </div>


                <form onSubmit={handleSave} className="p-6 space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Judul Jadwal / Shift *</label>
                    <input
                      type="text"
                      required
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      placeholder="Contoh: Shift 3 Mom Uung / Aquapress Siang"
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                    />
                  </div>


                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Akun / Brand *</label>
                      <select
                        value={formData.person_id}
                        onChange={e => setFormData({ ...formData, person_id: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                      >
                        {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Status *</label>
                      <select
                        value={formData.status}
                        onChange={e => setFormData({ ...formData, status: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                      >
                        <option value="LIVE">LIVE (Hijau)</option>
                        <option value="Meeting">Meeting (Cyan)</option>
                        <option value="OFF">OFF / Libur (Merah)</option>
                        <option value="Sakit / Izin">Sakit / Izin (Maroon)</option>
                      </select>
                    </div>
                  </div>


                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tanggal *</label>
                    <input
                      type="date"
                      required
                      value={formData.date}
                      onChange={e => setFormData({ ...formData, date: e.target.value })}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                    />
                  </div>


                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jam Mulai *</label>
                      <input
                        type="time"
                        required
                        value={formData.start_time}
                        onChange={e => setFormData({ ...formData, start_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jam Selesai *</label>
                      <input
                        type="time"
                        required
                        value={formData.end_time}
                        onChange={e => setFormData({ ...formData, end_time: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                      />
                    </div>
                  </div>


                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Catatan Tambahan</label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({ ...formData, notes: e.target.value })}
                      placeholder="Script, target GMV, atau arahan khusus..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-maroon"
                    ></textarea>

              </div>

              <div className="pt-3 border-t border-slate-100 flex justify-between items-center">
                {selectedSchedule ? (
                  <button
                    type="button"
                    onClick={() => handleDelete(selectedSchedule.id)}
                    className="text-rose-600 hover:text-rose-800 font-bold"
                  >
                    Hapus Jadwal
                  </button>
                ) : <div></div>}

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setModalOpen(false)}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl font-bold"
                  >
                    Batal
                  </button>
                  <button
                    type="submit"
                    className="bg-maroon hover:bg-maroon-dark text-white px-5 py-2 rounded-xl font-bold shadow"
                  >
                    Simpan
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
